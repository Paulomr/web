<section class="dk" [id]="ancla" aria-label="Novedades de Crunchy Munch">
  <div class="dk-inner">
    <!-- Dos pósters del mismo tamaño: la galleta nueva y el producto de
         temporada. Cada póster lleva su nombre impreso, así que aquí no se
         repite: el <h2> de cada uno va oculto y solo titula la ventana. -->
    <div class="dk-puertas" [class.sola]="!temporada()">
      <!-- ================= 1 · La galleta nueva ================= -->
      <article class="dk-puerta" aria-labelledby="dk-nombre">
        <h2 class="dk-oculto" id="dk-nombre">{{ nombre() }}</h2>

        <figure class="dk-marco" #marco>
          <!-- Halo: la misma foto a 64 px, desenfocada. No es un resplandor
               inventado, es la luz de la propia galleta sobre el terciopelo. -->
          <img class="dk-aura" [src]="aura" alt="" aria-hidden="true" width="64" height="85" />
          <img
            class="dk-foto"
            [src]="foto"
            [alt]="'Póster de la ' + nombre() + ': la galleta sostenida en la mano'"
            width="1100"
            height="1467"
            loading="lazy"
            decoding="async"
          />
        </figure>

        <div class="dk-texto" #texto>
          <p class="dk-desc">{{ descripcion() }}</p>

          <p class="dk-datos">
            <span class="dk-precio">{{ precio() }}</span>
            <span class="dk-sep" aria-hidden="true">·</span>
            <span class="dk-gramos">{{ detalleCorto() }}</span>
          </p>

          <button
            type="button"
            class="dk-cta"
            [attr.aria-label]="'Ordena ya: ' + nombre()"
            (click)="ordenar()"
          >
            <span class="dk-cta-txt">Ordena ya</span>
            <span class="dk-cta-flecha" aria-hidden="true">▸</span>
          </button>
        </div>
      </article>

      <!-- ================= 2 · El de temporada ================= -->
      @if (temporada(); as t) {
        <article class="dk-puerta" aria-labelledby="dk-temporada">
          <h2 class="dk-oculto" id="dk-temporada">{{ t.nombre }}</h2>

          <figure class="dk-marco dk-marco-temporada" #marcoDos>
            <img class="dk-aura" [src]="auraTemporada" alt="" aria-hidden="true" width="64" height="86" />
            <img
              class="dk-foto"
              [src]="fotoTemporada"
              alt="Póster del Dracula Milkshake: el vaso con helado de fresa, chocolate y mermelada que chorrea"
              width="1100"
              height="1474"
              loading="lazy"
              decoding="async"
            />
          </figure>

          <div class="dk-texto" #textoDos>
            <p class="dk-desc">{{ ingredientesTemporada }}</p>

            <p class="dk-datos">
              <span class="dk-precio">{{ precioTemporada() }}</span>
              <span class="dk-sep" aria-hidden="true">·</span>
              <span class="dk-gramos">{{ hastaTemporada }}</span>
            </p>

            <button
              type="button"
              class="dk-cta"
              [attr.aria-label]="'Ordena ya: ' + t.nombre"
              (click)="ordenarTemporada()"
            >
              <span class="dk-cta-txt">Ordena ya</span>
              <span class="dk-cta-flecha" aria-hidden="true">▸</span>
            </button>
          </div>
        </article>
      }
    </div>
  </div>
</section>
