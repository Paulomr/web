@if (svc.top().length > 0) {
  <a class="vt" [routerLink]="rutaPostula" aria-label="Ver la convocatoria y votar">
    <span class="vt-head">
      <span class="vt-titulo">Lo más votado</span>
      <span class="vt-total">{{ svc.totalVotos() }} votos</span>
    </span>

    <ol class="vt-lista">
      @for (p of svc.top(); track p.id; let i = $index) {
        <li class="vt-fila" [class.lider]="i === 0">
          <span class="vt-puesto" aria-hidden="true">{{ puesto(i) }}</span>
          <span class="vt-negocio">{{ p.negocio }}</span>
          <span class="vt-votos">{{ p.votos }}</span>
        </li>
      }
    </ol>

    <span class="vt-pie">
      <span>Postula el tuyo</span>
      <span class="vt-flecha" aria-hidden="true">▸</span>
    </span>
  </a>
} @else if (svc.cargado()) {
  <!-- Todavía no hay ningún negocio aprobado. En vez de dejar el hueco vacío,
       el recuadro invita: es el mismo sitio y la misma cápsula, solo que aún
       no hay marcador que enseñar. Se espera a `cargado` para no dar el salto
       de "invitación → tabla" mientras llega la respuesta. -->
  <a class="vt vt-invita" [routerLink]="rutaPostula">
    <span class="vt-titulo">Convocatoria abierta</span>
    <span class="vt-invita-txt">Pon el tuyo</span>
    <span class="vt-pie">
      <span>Un carrito en tu local</span>
      <span class="vt-flecha" aria-hidden="true">▸</span>
    </span>
  </a>
}
